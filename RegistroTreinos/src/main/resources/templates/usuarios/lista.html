<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Usuários')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Usuários</h1>
        <a th:href="@{/usuarios/novo}" class="btn btn-success">+ Novo usuário</a>
    </div>

    <form method="get" th:action="@{/usuarios}" class="row g-2 mb-3">
        <input type="hidden" name="direcao" th:value="${direcao}">
        <div class="col-auto">
            <input type="text" name="nome" th:value="${nome}" class="form-control" placeholder="Pesquisar por nome">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Pesquisar</button>
        </div>
        <div class="col-auto" th:if="${nome != null and !nome.isEmpty()}">
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Limpar</a>
        </div>
    </form>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>
                <a class="text-decoration-none text-dark"
                   th:href="@{/usuarios(nome=${nome}, direcao=${direcao == 'asc' ? 'desc' : 'asc'})}">
                    Nome
                    <span th:text="${direcao == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th class="text-end">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.id}"></td>
            <td th:text="${usuario.nome}"></td>
            <td class="text-end">
                <a th:href="@{/usuarios/{id}/treinos(id=${usuario.id})}" class="btn btn-sm btn-outline-primary">Treinos</a>
                <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <form th:action="@{/usuarios/{id}/excluir(id=${usuario.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Excluir este usuário?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${usuarios.isEmpty()}">
            <td colspan="3" class="text-center text-muted">Nenhum usuário encontrado.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
