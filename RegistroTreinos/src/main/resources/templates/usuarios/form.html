<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo=${usuario.id} == null ? 'Novo usuário' : 'Editar usuário')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <h1 class="h3 mb-3" th:text="${usuario.id} == null ? 'Novo usuário' : 'Editar usuário'"></h1>

    <form th:action="${usuario.id} == null ? @{/usuarios} : @{/usuarios/{id}/editar(id=${usuario.id})}"
          th:object="${usuario}" method="post" class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Nome *</label>
            <input type="text" th:field="*{nome}" class="form-control" required maxlength="255">
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
