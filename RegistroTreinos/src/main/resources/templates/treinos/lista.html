<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Treinos de ' + ${usuario.nome})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div th:replace="~{fragments/layout :: alertas}"></div>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/usuarios}">Usuários</a></li>
            <li class="breadcrumb-item active" th:text="${usuario.nome}"></li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="'Treinos de ' + ${usuario.nome}"></h1>
        <a th:href="@{/usuarios/{usuarioId}/treinos/novo(usuarioId=${usuario.id})}" class="btn btn-success">+ Novo treino</a>
    </div>

    <form method="get" th:action="@{/usuarios/{usuarioId}/treinos(usuarioId=${usuario.id})}" class="row g-2 mb-3">
        <input type="hidden" name="direcao" th:value="${direcao}">
        <div class="col-auto">
            <input type="text" name="nomeTreino" th:value="${nomeTreino}" class="form-control" placeholder="Pesquisar por nome do treino">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Pesquisar</button>
        </div>
        <div class="col-auto" th:if="${nomeTreino != null and !nomeTreino.isEmpty()}">
            <a th:href="@{/usuarios/{usuarioId}/treinos(usuarioId=${usuario.id})}" class="btn btn-outline-secondary">Limpar</a>
        </div>
    </form>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>
                <a class="text-decoration-none text-dark"
                   th:href="@{/usuarios/{usuarioId}/treinos(usuarioId=${usuario.id}, nomeTreino=${nomeTreino}, direcao=${direcao == 'asc' ? 'desc' : 'asc'})}">
                    Data
                    <span th:text="${direcao == 'asc' ? '▲' : '▼'}"></span>
                </a>
            </th>
            <th>Nome do treino</th>
            <th class="text-end">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="treino : ${treinos}">
            <td th:text="${#temporals.format(treino.date, 'dd/MM/yyyy')}"></td>
            <td th:text="${treino.nomeTreino}"></td>
            <td class="text-end">
                <a th:href="@{/treinos/{id}/itens(id=${treino.id})}" class="btn btn-sm btn-outline-primary">Exercícios</a>
                <a th:href="@{/usuarios/{usuarioId}/treinos/{id}/editar(usuarioId=${usuario.id}, id=${treino.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                <form th:action="@{/usuarios/{usuarioId}/treinos/{id}/excluir(usuarioId=${usuario.id}, id=${treino.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Excluir este treino e todos os seus exercícios?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${treinos.isEmpty()}">
            <td colspan="3" class="text-center text-muted">Nenhum treino encontrado.</td>
        </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
